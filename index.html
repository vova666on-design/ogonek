<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Огонёк группы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0a1c;--fg:#fff;--dim:rgba(255,255,255,.6);--card:rgba(255,255,255,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 25%,#2d1030 0,var(--bg) 62%) fixed;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.view{position:relative;padding:112px 14px 110px;display:none;flex-direction:column;align-items:center}
.view.on{display:flex}
.flame{display:inline-block;line-height:1;user-select:none;transform-origin:50% 90%;animation:fl 1.6s ease-in-out infinite;--hue:0deg;--glow:#ff7a18;filter:hue-rotate(var(--hue)) drop-shadow(0 0 14px var(--glow))}
.flame.purple{--hue:265deg;--glow:#a45bff}
.flame.blue{--hue:195deg;--glow:#3aa7ff}
.flame.ember{filter:grayscale(1) brightness(.55);animation:none;opacity:.8}
.flame.pop{animation:pop .9s ease-out,fl 1.6s ease-in-out .9s infinite}
@keyframes fl{0%,100%{transform:scale(1) rotate(-2deg)}30%{transform:scale(1.06,1.1) rotate(2deg)}60%{transform:scale(.97,1.03) rotate(-1deg)}}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.45)}100%{transform:scale(1)}}
.big{font-size:104px}
.num{font-size:64px;font-weight:800;margin-top:-4px;text-shadow:0 0 24px var(--glow,#ff9a3c)}
.lbl{color:var(--dim);font-size:15px;text-align:center}
.st{margin:12px 0 18px;padding:8px 16px;border-radius:18px;background:var(--card);font-size:15px}
.cells{width:100%;max-width:460px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px 10px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;animation:in .5s both;position:relative}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.9)}}
.cell .fw{position:relative;display:flex;align-items:center;justify-content:center}
.cell .cnt{position:absolute;bottom:-6px;font-size:22px;font-weight:800;text-shadow:0 2px 8px #000,0 0 10px var(--glow)}
.cell .hg{position:absolute;top:-4px;right:-10px;font-size:20px;animation:sw 1.2s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(25deg)}}
.pic{border-radius:50%;background:#222 center/cover;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--ring,#555);margin-top:6px}
.nm{font-size:14px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .nm{color:#ffc477;font-weight:700}
.sm{font-size:12px;color:var(--dim)}
.ft{margin-top:22px;font-size:13px;color:var(--dim);text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,10,25,.92);backdrop-filter:blur(12px);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));gap:8px;z-index:5}
.tabs button{flex:1;padding:12px;border-radius:14px;border:0;background:transparent;color:var(--dim);font:inherit;font-weight:600}
.tabs button.on{background:var(--card);color:var(--fg)}
.panel{width:100%;max-width:480px}
.panel h2{margin:0 0 12px;font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0;background:var(--card);padding:10px;border-radius:14px}
.row .who{flex:1 1 130px;min-width:0}
.row .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input,select,button{font:inherit;color:var(--fg)}
input,select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:9px;width:100%}
input[type=number]{width:70px}
.go{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,#ff9a3c,#ff4d2e);font-weight:700;white-space:nowrap}
.go.g{background:var(--card)}
.go.d{background:rgba(255,70,70,.22);padding:10px 12px}
.go.pu{background:linear-gradient(135deg,#a45bff,#ff5fd2)}
.c{position:fixed;top:-20px;font-size:22px;pointer-events:none;z-index:9;animation:cf 2.6s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
</style></head><body>
<canvas id="c"></canvas>
<section class="view on" id="v1">
 <div id="gf" class="flame ember big">🔥</div>
 <div class="num" id="n">…</div>
 <div class="lbl" id="l">загружаем огонёк</div>
 <div class="st" id="st" hidden></div>
 <div class="cells" id="g"></div>
 <div class="ft" id="ft"></div>
</section>
<section class="view" id="v2"><div class="panel" id="adm"></div></section>
<nav class="tabs"><button class="on" id="t1">🔥 Огонёк</button><button id="t2">🛠 Админ</button></nav>
<script>
const SB_URL='https://kbeqbtfuyocyikhqqbbd.supabase.co';
const SB_KEY='sb_publishable_viFYHlZmWhz0_caUWK-awg_iDRJZeYE';
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0a0a1c');tg.setBackgroundColor('#0a0a1c')}catch(e){}}
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
let uid,name,photo=tu&&tu.photo_url||null;
if(tu){uid=String(tu.id);const emp=x=>!x||!x.replace(/[\s\u200b-\u200f\u2060\u3164\u115f\u1160\ufe0e\ufe0f\ufeff]/g,'');
 name=((tu.first_name||'')+' '+(tu.last_name||'')).trim();if(emp(name))name=tu.username||'Участник'}
else{uid=null;name=null}
const _i=(tg&&tg.initDataUnsafe)||{};const chat=String(_i.start_param||_i.chat_instance||'demo').slice(0,40);
const buzz=k=>{try{tg.HapticFeedback.notificationOccurred(k||'success')}catch(e){}};
async function rpc(fn,args){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify(args)});if(!r.ok)throw new Error(r.status);return r.json()}
const days=n=>{const a=n%10,b=n%100;return b>10&&b<15?'дней':a==1?'день':a>1&&a<5?'дня':'дней'};
// как в TikTok: огонёк с 3 дней; цвета (по неофициальным данным): оранжевый -> фиолетовый на 100 -> синий на 400
const cls=n=>n>=400?'blue':n>=100?'purple':n>=3?'':'ember';
const ring=n=>n>=400?'#3aa7ff':n>=100?'#a45bff':n>=3?'#ff8a3c':'#555';
const hrs=s=>s>=3600?Math.ceil(s/3600)+' ч':Math.max(1,Math.ceil(s/60))+' мин';
const msgs={started:'Огонёк зажжён! Ещё 3 дня подряд — и он загорится 🎉',extended:'+1 день! Твой огонёк растёт 🚀',restarted:'Огонёк погас и начался заново',same_day:'Сегодня уже засчитано ✓'};
let state=null,at=0,sparks=[];
function left(x){return Math.max(0,(x.left||0)-(Date.now()-at)/1000)}
function render(s,status){
 state=s;at=Date.now();const G=s.group||{streak:0,best:0,alive:false,left:0};
 $('n').textContent=G.streak;
 const gf=$('gf');gf.className='flame big '+cls(G.streak)+(gf.classList.contains('pop')?' pop':'');
 document.documentElement.style.setProperty('--glow',{'blue':'#3aa7ff','purple':'#a45bff'}[cls(G.streak)]||'#ff9a3c');
 $('l').textContent=days(G.streak)+' подряд · рекорд '+G.best+(G.streak&&G.streak<3?' · до огонька '+(3-G.streak):'');
 if(status){const st=$('st');st.hidden=false;st.textContent=msgs[status]||''}
 const N=s.members.length,w=N<=1?'62%':N<=6?'44%':'30%';
 const fs=N<=1?96:N<=2?84:N<=6?72:54,ps=N<=1?64:N<=6?52:42;
 const g=$('g');g.replaceChildren();
 if(!N)g.append(el('div','lbl','Пока никого нет'));
 s.members.forEach((m,i)=>{
  const c=el('div','cell'+(m.id===uid?' me':''));c.style.width=w;c.style.animationDelay=i*80+'ms';
  const fw=el('div','fw'),f=el('div','flame '+cls(m.streak),'🔥');f.style.fontSize=fs+'px';
  fw.append(f,el('div','cnt',m.streak));
  if(m.alive&&m.streak>=3&&left(m)<14400)fw.append(el('div','hg','⌛'));
  const p=el('div','pic');p.style.width=p.style.height=ps+'px';p.style.setProperty('--ring',ring(m.streak));p.style.fontSize=ps*.4+'px';
  if(m.photo)p.style.backgroundImage='url("'+m.photo.replace(/"/g,'')+'")';else{p.textContent=(m.name||'?')[0].toUpperCase();p.style.background='hsl('+(parseInt(m.id.replace(/\D/g,'')||'7')%360)+',55%,38%)'}
  c.append(fw,p,el('div','nm',(m.name&&m.name.replace(/[\s\u200b-\u200f\u2060\u3164\u115f\u1160\ufe0e\ufe0f\ufeff]/g,'')?m.name:'Участник')));
  if(m.alive&&m.streak>=3&&left(m)<14400)c.append(el('div','sm','осталось '+hrs(left(m))));
  else if(!m.alive&&m.lost)c.append(el('div','sm','серия потеряна'));
  else if(m.streak<3)c.append(el('div','sm',m.streak+'/3 до огонька'));
  g.append(c)});
 const risk=s.members.filter(m=>m.alive&&m.streak>=3&&left(m)<14400).length;
 $('ft').textContent=risk?'⌛ Огонёк почти погас у '+risk+' чел. — загляните сегодня!':'Заходи хотя бы раз в день — каждый новый день огонёк растёт на +1';
}
setInterval(()=>state&&render(state),60000);
function confetti(){const e=['🔥','✨','🎉','⭐','💥'];for(let i=0;i<34;i++){const c=el('div','c',e[i%5]);c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.append(c);setTimeout(()=>c.remove(),3600)}}
async function touch(){
 try{
  const d=await rpc('fire_touch',{p_chat:chat,p_user:uid,p_name:name,p_photo:photo});
  render(d.state,d.status);
  if(d.status!=='same_day'){$('gf').classList.add('pop');buzz();const me=d.state.members.find(m=>m.id===uid);if(d.status==='extended')confetti();if(me&&[3,7,30,100,200,400,365].includes(me.streak))confetti()}
 }catch(e){$('n').textContent='—';$('l').textContent='не удалось загрузить, попробуйте позже'}
}
if(tu)touch();else{$('n').textContent='🔥';$('l').textContent='Огонёк работает только внутри Telegram';const st=$('st');st.hidden=false;const a=el('a',null,'Открыть в Telegram');a.href='https://t.me/lightTG_bot/fire';a.style.color='#ffc477';st.append(a)}
// ===== вкладки =====
function tab(k){$('v1').classList.toggle('on',k==1);$('v2').classList.toggle('on',k==2);$('t1').classList.toggle('on',k==1);$('t2').classList.toggle('on',k==2);if(k==2)adminView(sel||chat);buzz('warning')}
let sel=null;$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
// ===== админ =====
let code='';try{code=localStorage.getItem('acode')||''}catch(e){}
function ask(t,cb){try{if(tg&&tg.showConfirm){tg.showConfirm(t,y=>{if(y)cb()});return}}catch(e){}if(confirm(t))cb()}
async function ok(c){try{return await rpc('fire_admin_check',{p_code:c})}catch(e){return false}}
async function adminView(ch){
 const a=$('adm');a.replaceChildren();sel=ch;
 if(!code||!(await ok(code))){
  a.append(el('h2',null,'🔒 Панель админа'),el('div','lbl','Введите специальный пароль, чтобы разблокировать восстановление огоньков'));
  const i=el('input');i.type='password';i.placeholder='Пароль';i.style.margin='14px 0 10px';
  const b=el('button','go','Разблокировать');b.onclick=async()=>{if(await ok(i.value)){code=i.value;try{localStorage.setItem('acode',code)}catch(e){}buzz();adminView(ch)}else{buzz('error');i.value='';i.placeholder='Неверный пароль'}};
  a.append(i,b);return}
 a.append(el('h2',null,'🛠 Админ разблокирован'));
 const groups=await rpc('fire_admin_groups',{p_code:code});
 const sl=el('select');groups.forEach(x=>{const o=el('option',null,'Группа '+x.chat+' · '+x.members+' чел.');o.value=x.chat;if(x.chat===ch)o.selected=true;sl.append(o)});
 sl.onchange=()=>adminView(sl.value);a.append(sl);
 const s=await rpc('fire_admin_state',{p_code:code,p_chat:ch});
 const line=(ttl,sub,val,lost,fn,del)=>{const r=el('div','row'),w=el('div','who');w.append(el('b',null,ttl),el('div','sm',sub));
  const i=el('input');i.type='number';i.min=0;i.value=val;
  const run=async(n,f)=>{try{const ns=await (f||fn)(n);buzz();if(ch===chat)render(ns);adminView(ch)}catch(e){buzz('error')}};
  const set=el('button','go g','Задать');set.onclick=()=>run(+i.value);r.append(w,i,set);
  if(lost){const rb=el('button','go pu','Вернуть '+lost);rb.onclick=()=>run(lost);r.append(rb)}
  if(del){const db=el('button','go d','🗑');db.title='Удалить';db.onclick=()=>ask('Удалить «'+ttl.replace(/^⭐ /,'')+'» вместе с огоньком?',()=>run(null,del));r.append(db)}
  a.append(r)};
 const G=s.group||{streak:0,best:0,lost:0};
 line('🔥 Огонёк группы','сейчас '+G.streak+' · рекорд '+G.best,G.streak,G.lost,n=>rpc('fire_admin_set_group',{p_code:code,p_chat:ch,p_streak:n}));
 s.members.forEach(m=>line((m.id===uid?'⭐ ':'')+(m.name||m.id),'сейчас '+m.streak+' · рекорд '+m.best+(m.lost?' · можно вернуть '+m.lost:''),m.streak,m.lost,n=>rpc('fire_admin_set_member',{p_code:code,p_chat:ch,p_user:m.id,p_streak:n}),()=>rpc('fire_admin_delete_member',{p_code:code,p_chat:ch,p_user:m.id})));
 a.append(el('div','sm','«Вернуть» работает 48 часов после потери. «Задать» ставит любое число и оживляет огонёк до конца следующего дня. 🗑 удаляет человека вместе с огоньком.'));
 const np=el('input');np.type='password';np.placeholder='Новый пароль (от 6 символов)';np.style.marginTop='18px';
 const nb=el('button','go g','Сменить пароль');nb.style.marginTop='8px';
 nb.onclick=async()=>{try{await rpc('fire_admin_set_code',{p_code:code,p_new:np.value});code=np.value;try{localStorage.setItem('acode',code)}catch(e){}buzz();np.value='';np.placeholder='Пароль изменён ✓'}catch(e){buzz('error');np.placeholder='Слишком короткий'}};
 const ex=el('button','go g','Выйти из админки');ex.style.cssText='margin:8px 0 0 8px';ex.onclick=()=>{code='';try{localStorage.removeItem('acode')}catch(e){}adminView(ch)};
 a.append(np,nb,ex);
}
// ===== гирлянда + искры =====
const cv=$('c'),ctx=cv.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2);
function fit(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',fit);fit();
function frame(now){
 const T=now/1000;ctx.clearRect(0,0,W,H);const n=Math.round(W/28);
 for(let s=0;s<2;s++){const y=22+s*46,cy=y+56,cx=W/2;
  ctx.strokeStyle='rgba(120,120,140,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-10,y);ctx.quadraticCurveTo(cx,cy,W+10,y);ctx.stroke();
  for(let i=0;i<=n;i++){const u=i/n,v=1-u,x=v*v*-10+2*v*u*cx+u*u*(W+10),py=v*v*y+2*v*u*cy+u*u*y+8;
   const h=(i*14+s*40+T*50)%360,l=.7+.3*Math.sin(T*3+i*1.3+s);
   const g=ctx.createRadialGradient(x,py,0,x,py,22);g.addColorStop(0,`hsla(${h},100%,${55+l*20}%,${.2+l*.6})`);g.addColorStop(1,`hsla(${h},100%,50%,0)`);
   ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,py,22,0,7);ctx.fill();
   ctx.globalCompositeOperation='source-over';ctx.fillStyle=`hsl(${h},100%,${40+l*40}%)`;ctx.beginPath();ctx.ellipse(x,py+2,4,6,0,0,7);ctx.fill()}}
 const gf=$('gf');
 if($('v1').classList.contains('on')&&!gf.classList.contains('ember')&&Math.random()<.5){const f=gf.getBoundingClientRect(),k=gf.classList.contains('blue')?[90,170,255]:gf.classList.contains('purple')?[180,110,255]:[255,170,60];
  sparks.push({x:f.left+f.width/2+(Math.random()-.5)*50,y:f.top+f.height*.5,vx:(Math.random()-.5)*.6,vy:-1-Math.random()*1.6,a:1,k})}
 ctx.globalCompositeOperation='lighter';
 sparks=sparks.filter(p=>p.a>0);sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a-=.012;ctx.fillStyle=`rgba(${p.k[0]},${p.k[1]},${p.k[2]},${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,2.2*p.a+.5,0,7);ctx.fill()});
 ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
